<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper scissors game</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="body-container">
    <h1>ROCK PAPER SCISSORS GAME</h1>
    <p class="introductory-sentence"> You will be playing against computer best of five.Will you beat the computer?</p>

    <div class="score-board">
        <p>SCOREBOARD</p>
        <p>YOU  <span class="user-score">0</span> : COMPUTER  <span class="computer-score">0</span> </p>
        <p class="finalWinner"></p>
    </div>  


    <div class="buttons">
        <button id="rock"><img src="./images/rock.png" alt="rock hand sign" class="button-img"></button>
        <button id="paper"><img src="./images/paper.png" alt="paper hand sign"  class="button-img"></button>
        <button id="scissors"><img src="./images/scissors1.png" alt="scissors hand sign"  class="button-img"></button>
    </div>
    <div class="score-result">



    </div>

</div>




    
</body>
</html>
